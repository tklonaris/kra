# Shared transactional-outbox connector. Compose supplies credentials and deployment-specific names.
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=${KRA_CDC_USER:kra_cdc}
debezium.source.database.password=${KRA_CDC_PASSWORD}
debezium.source.database.dbname=${KRA_DB_NAME:kra}
debezium.source.topic.prefix=kra-outbox-cdc
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=${KRA_CDC_SLOT_NAME:kra_outbox_slot}
debezium.source.slot.drop.on.stop=false
debezium.source.publication.name=${KRA_CDC_PUBLICATION:kra_outbox_publication}
debezium.source.publication.autocreate.mode=disabled
debezium.source.schema.include.list=kra
debezium.source.table.include.list=kra.voucher_outbox,kra.payment_outbox
debezium.source.snapshot.mode=initial

debezium.source.offset.storage=io.debezium.storage.jdbc.offset.JdbcOffsetBackingStore
debezium.source.offset.storage.jdbc.connection.url=jdbc:postgresql://postgres:5432/${KRA_DB_NAME:kra}?currentSchema=kra
debezium.source.offset.storage.jdbc.connection.user=${KRA_CDC_STATE_USER:kra_cdc_state}
debezium.source.offset.storage.jdbc.connection.password=${KRA_CDC_STATE_PASSWORD}
debezium.source.offset.storage.jdbc.table.name=kra.debezium_offset_storage
# Liquibase owns the table; the state role deliberately has no schema CREATE privilege.
debezium.source.offset.storage.jdbc.table.ddl=SELECT 1
# The application owns this table through Liquibase. Keep retrying while a fresh
# Compose stack waits for the application's first migration instead of restart-looping.
debezium.source.offset.storage.jdbc.connection.retry.max.attempts=2147483647
debezium.source.offset.flush.interval.ms=0

debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.table.field.event.id=event_id
debezium.transforms.outbox.table.field.event.key=aggregate_id
debezium.transforms.outbox.table.field.event.payload=payload
debezium.transforms.outbox.table.expand.json.payload=true
debezium.transforms.outbox.route.by.field=aggregate_type
# Debezium Server uses Quarkus configuration: double the dollar so Quarkus passes the EventRouter
# placeholder literally as ${routedByValue}.
debezium.transforms.outbox.route.topic.replacement=kra.$${routedByValue}.events
debezium.transforms.outbox.table.fields.additional.placement=event_type:header:eventType,occurred_at:header:occurredAt

debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.header=json
debezium.format.header.schemas.enable=false

debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=rabbitmq
debezium.sink.rabbitmq.connection.username=${KRA_RABBITMQ_USER:kra}
debezium.sink.rabbitmq.connection.password=${KRA_RABBITMQ_PASSWORD}
# With no static exchange override, Debezium Server uses the routed destination name. That maps
# voucher rows to kra.voucher.events and payment rows to kra.payment.events.
debezium.sink.rabbitmq.ackTimeout=30000
debezium.sink.rabbitmq.deliveryMode=2
